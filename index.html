<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3a4b">
<title>旅遊行程系統</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#22303a; --muted:#6b7a85;
  --line:#e6e0d4; --brand:#1b3a4b; --brand2:#2c6e7f; --accent:#c8622d;
  --gold:#c99a3a; --am:#e9a23b; --pm:#3a86a8; --ev:#5b5b8a;
  --ok:#2e9e6b; --shadow:0 6px 24px rgba(30,45,55,.10);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  padding-bottom:80px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* Header */
header{
  background:linear-gradient(135deg,#1b3a4b 0%,#2c6e7f 60%,#3a86a8 100%);
  color:#fff;padding:18px 0 20px;position:relative;overflow:hidden;
}
header::after{content:"";position:absolute;right:-40px;top:-30px;width:200px;height:200px;
  background:radial-gradient(circle,rgba(201,154,58,.35),transparent 70%);pointer-events:none}
.htop{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.5px;opacity:.92}
.brand .logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;font-size:17px}
.tripsel{display:flex;align-items:center;gap:8px}
.tripsel select{
  background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);
  border-radius:10px;padding:7px 10px;font-size:14px;font-weight:600;max-width:190px}
.tripsel select option{color:#22303a}
.iconbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.14);
  color:#fff;display:grid;place-items:center;font-size:17px;border:1px solid rgba(255,255,255,.2)}
.iconbtn:active{transform:scale(.94)}
.htitle{margin-top:14px}
.htitle h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.5px}
.htitle .sub{opacity:.85;font-size:14px;margin-top:2px}
.hmeta{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;font-size:13px}
.hmeta .chip{background:rgba(255,255,255,.15);padding:6px 12px;border-radius:999px;
  display:flex;align-items:center;gap:6px;font-weight:600}

/* Tabs */
.tabs{display:flex;gap:6px;margin:16px 0 6px;background:#fff;padding:6px;border-radius:14px;
  box-shadow:var(--shadow);position:sticky;top:8px;z-index:20}
.tabs button{flex:1;padding:10px 6px;border-radius:10px;font-weight:700;font-size:14px;
  color:var(--muted);transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:var(--brand);color:#fff}
.tabs .em{font-size:16px}

/* Section */
.view{padding:16px 0 30px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Day cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.daycard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;cursor:pointer;transition:.18s;border:1px solid var(--line);display:flex;flex-direction:column}
.daycard:active{transform:scale(.985)}
.daycard:hover{box-shadow:0 10px 30px rgba(30,45,55,.16)}
.dc-top{padding:14px 16px 10px;background:linear-gradient(120deg,#fbf8f1,#fff);position:relative}
.dc-daynum{position:absolute;right:14px;top:12px;font-size:12px;font-weight:800;color:#fff;
  background:var(--brand2);border-radius:8px;padding:3px 9px}
.dc-date{font-size:13px;color:var(--muted);font-weight:600}
.dc-title{font-size:17px;font-weight:800;margin-top:3px;line-height:1.35;padding-right:52px}
.dc-body{padding:6px 16px 12px;flex:1;display:flex;flex-direction:column;gap:7px}
.slot{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.slot .tag{flex:none;width:42px;text-align:center;font-weight:800;font-size:11px;color:#fff;
  border-radius:6px;padding:3px 0;margin-top:1px}
.slot.am .tag{background:var(--am)} .slot.pm .tag{background:var(--pm)} .slot.ev .tag{background:var(--ev)}
.slot .txt{color:#41525c;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot.empty{opacity:.4}
.dc-foot{border-top:1px dashed var(--line);padding:10px 16px;display:flex;
  justify-content:space-between;align-items:center;gap:8px;background:#fcfbf7}
.dc-lodge{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dc-price{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,30,38,.55);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:22px 22px 0 0;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@media(min-width:680px){.modal{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}
.sheet-hd{position:sticky;top:0;background:linear-gradient(135deg,#1b3a4b,#2c6e7f);color:#fff;
  padding:18px 20px 16px;border-radius:22px 22px 0 0;z-index:2}
.sheet-hd .close{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.2);color:#fff;font-size:18px;display:grid;place-items:center}
.sheet-hd .d{font-size:13px;opacity:.85;font-weight:600}
.sheet-hd h2{margin:3px 46px 0 0;font-size:21px;font-weight:800}
.sheet-bd{padding:16px 18px 30px}
.tl{position:relative;padding-left:8px}
.tlrow{display:flex;gap:12px;margin-bottom:14px}
.tlrow .lab{flex:none;width:46px}
.tlrow .lab .b{font-weight:800;font-size:12px;color:#fff;border-radius:8px;padding:5px 0;
  text-align:center;display:block}
.tlrow.am .b{background:var(--am)} .tlrow.pm .b{background:var(--pm)} .tlrow.ev .b{background:var(--ev)}
.tlrow .content{flex:1;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);
  font-size:14px;color:#39474f;white-space:pre-wrap;word-break:break-word}
.tlrow .content a{color:var(--brand2);font-weight:700;word-break:break-all}
.info-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.info-box{flex:1;min-width:150px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.info-box .k{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.info-box .v{font-size:15px;font-weight:800}
.linkbtn{display:inline-flex;align-items:center;gap:7px;background:var(--brand2);color:#fff;
  padding:9px 14px;border-radius:11px;font-weight:700;font-size:13.5px;text-decoration:none;margin-top:8px}
.linkbtn:active{transform:scale(.96)}
.editbtn{background:var(--card);border:1px solid var(--line);color:var(--brand);
  padding:9px 14px;border-radius:11px;font-weight:700;font-size:13.5px;margin-top:8px}

/* Cost view */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px;border:1px solid var(--line);margin-bottom:14px}
.bigstat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;
  border:1px solid var(--line)}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:700}
.stat .v{font-size:26px;font-weight:800;margin-top:3px;color:var(--brand)}
.stat .v.accent{color:var(--accent)}
.stat .u{font-size:13px;color:var(--muted);font-weight:600}
.costlist .row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;
  border-bottom:1px solid var(--line);gap:10px}
.costlist .row:last-child{border-bottom:none}
.costlist .l{display:flex;flex-direction:column}
.costlist .l .d{font-size:14px;font-weight:700}
.costlist .l .s{font-size:12px;color:var(--muted)}
.costlist .amt{font-weight:800;color:var(--accent);font-size:15px}
.costlist .amt.none{color:var(--muted);font-weight:600;font-size:13px}

/* Checklist */
.checkhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.checkhd h3{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--ok));border-radius:99px;transition:.3s}
.chkitem{display:flex;align-items:center;gap:11px;padding:11px 6px;border-bottom:1px solid var(--line)}
.chkitem:last-child{border-bottom:none}
.chkitem .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;transition:.15s;font-size:14px;color:#fff}
.chkitem.done .box{background:var(--ok);border-color:var(--ok)}
.chkitem.done .t{text-decoration:line-through;color:var(--muted)}
.chkitem .t{flex:1;font-size:14.5px}
.chkitem .del{color:var(--muted);font-size:16px;padding:4px 6px;opacity:.6}
.chkitem .prib{font-size:13px;padding:4px 3px;opacity:.75;background:none;border:none;cursor:pointer;line-height:1}
.chkitem .pri{margin-right:5px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-size:14px;
  background:#fff;color:var(--ink)}
.addrow button{background:var(--brand);color:#fff;padding:0 18px;border-radius:11px;font-weight:700;font-size:14px}

/* route / navigation */
.routewrap{margin-top:20px}
.routewrap h3{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.routewrap .note{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px}
.route{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stop{display:flex;align-items:center;gap:11px}
.stop .dot{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.stop .nm{font-weight:700;font-size:14.5px;color:var(--ink)}
.seg{margin:5px 0 5px 12px;padding:4px 0 4px 18px;border-left:2px dashed var(--line);
  display:flex;align-items:center;gap:8px}
.navb{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;
  padding:7px 12px;border-radius:9px;text-decoration:none;transition:.12s}
.navb:active{transform:scale(.94)}
.navb.walk{background:#e8f4ee;color:#1f7a4d}
.navb.tran{background:#e8f0f8;color:#22557f}
.route .empty{color:var(--muted);font-size:13px}

/* food */
.food-hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip2{padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;background:#fff;
  color:var(--muted);border:1px solid var(--line)}
.chip2.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.locbtn{background:var(--accent);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;
  display:inline-flex;align-items:center;gap:6px}
.locbtn:active{transform:scale(.95)}
.food-group{margin-bottom:18px}
.food-group .gh{font-size:15px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:7px;color:var(--brand)}
.foodcard{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px;align-items:flex-start}
.fc-cat{flex:none;font-size:12px;font-weight:800;color:var(--brand2);background:#eaf1f5;
  border-radius:9px;padding:7px 9px;white-space:nowrap;max-width:96px;text-align:center;line-height:1.3}
.fc-main{flex:1;min-width:0}
.fc-name{font-weight:800;font-size:15px}
.fc-meta{display:flex;align-items:center;gap:10px;margin-top:3px;font-size:12.5px;font-weight:700}
.fc-meta .star{color:#e0a012}
.fc-meta .prc{color:#2e9e6b}
.fc-note{font-size:13px;color:var(--muted);margin-top:3px}
.fc-actions{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.fc-del{color:var(--muted);font-size:15px;padding:3px 6px;opacity:.55;margin-left:auto}
.fc-edit{color:var(--muted);font-size:14px;padding:3px 6px;opacity:.7}
.navb.walk2{background:#eef2f6;color:#42525c}
.fm-meta{font-size:11.5px;font-weight:700;color:#b0870f;margin-top:1px}
.foodmini{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;
  padding:10px 12px;box-shadow:var(--shadow);margin-bottom:8px}
.fm-cat{flex:none;font-size:19px;width:28px;text-align:center}
.fm-body{flex:1;min-width:0}
.fm-name{font-weight:700;font-size:14px}
.fm-note{font-size:12px;color:var(--muted);white-space:normal}
.fm-btn{flex:none}

/* generic buttons / forms */
.btn{background:var(--brand);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.danger{background:#fff;color:#c0392b;border:1px solid #edd}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.field textarea{min-height:88px;resize:vertical;line-height:1.6}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state .em{font-size:46px;margin-bottom:10px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;transition:.3s;z-index:200;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="htop">
      <div class="brand"><span class="logo">🧭</span> 旅遊行程系統</div>
      <div class="tripsel">
        <button id="editToggle" onclick="toggleEdit()">🔒 檢視模式</button>
        <button id="pdfBtn" onclick="exportPDF()" title="匯出 PDF：列印視窗請選「儲存為 PDF」">📄 PDF</button>
        <select id="tripSelect" onchange="switchTrip(this.value)"></select>
        <button class="iconbtn" title="行程管理" onclick="openManage()">⚙️</button>
      </div>
    </div>
    <div class="htitle">
      <h1 id="hName">—</h1>
      <div class="sub" id="hSub"></div>
    </div>
    <div class="hmeta" id="hMeta"></div>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="on" data-tab="itin" onclick="setTab('itin')"><span class="em">🗓️</span>行程</button>
    <button data-tab="food" onclick="setTab('food')"><span class="em">🍽️</span>美食</button>
    <button data-tab="cost" onclick="setTab('cost')"><span class="em">💰</span>費用</button>
    <button data-tab="check" onclick="setTab('check')"><span class="em">✅</span>清單</button>
    <button data-tab="split" onclick="setTab('split')"><span class="em">💰</span>分帳</button>
  </div>

  <div id="view-itin" class="view"></div>
  <div id="view-food" class="view" style="display:none"></div>
  <div id="view-cost" class="view" style="display:none"></div>
  <div id="view-check" class="view" style="display:none"></div>
  <div id="view-split" class="view" style="display:none"></div>
</div>

<footer>離線可用 · 資料存在此裝置瀏覽器 · 建議加入主畫面當 App 用</footer>

<!-- 匯出 PDF 用的列印版內容（螢幕上隱藏，只有列印時出現） -->
<div id="printArea"></div>

<!-- Day detail / edit modal -->
<div class="modal" id="dayModal">
  <div class="sheet"><div id="dayModalBody"></div></div>
</div>
<!-- Manage modal -->
<div class="modal" id="manageModal">
  <div class="sheet"><div id="manageBody"></div></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importFile(event)">

<!-- Firebase 雲端同步 SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
  /* 檢視（唯讀）模式：隱藏所有會改到資料的按鈕 */
  body.ro .iconbtn,
  body.ro .editbtn,
  body.ro .fc-edit,
  body.ro .fc-del,
  body.ro .del, body.ro .prib{ display:none !important; }
  /* 右上角編輯開關 */
  #editToggle{ cursor:pointer; border:1px solid rgba(255,255,255,.55); background:rgba(255,255,255,.12);
    color:#fff; font:inherit; font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px;
    white-space:nowrap; }
  #editToggle:hover{ background:rgba(255,255,255,.22); }
  #editToggle.editing{ background:#c8622d; border-color:#c8622d; }

  /* ===== 行程時間軸 ===== */
  .tln-legend{ display:flex; gap:16px; margin:2px 0 14px; font-size:12px; color:var(--muted); }
  .tln-legend .lg{ display:inline-flex; align-items:center; gap:6px; font-weight:600; }
  .tln-legend .lg::before{ content:""; width:11px; height:11px; border-radius:50%; }
  .tln-legend .lg-move::before{ background:var(--accent); }
  .tln-legend .lg-stay::before{ background:#3a9e73; }
  .tln{ position:relative; }
  /* 時段分隔（上午／下午／晚上對比） */
  .tln-period{ display:flex; align-items:center; gap:7px; font-weight:800; font-size:13.5px;
    margin:18px 0 12px; padding:7px 14px; border-radius:9px; }
  .tln-period:first-child{ margin-top:0; }
  .p-am{ color:#8a5a12; background:#fdf1dc; border-left:4px solid var(--am); }
  .p-pm{ color:#1c5568; background:#e5f1f6; border-left:4px solid var(--pm); }
  .p-ev{ color:#3f3f66; background:#ecebf3; border-left:4px solid var(--ev); }
  /* 通勤段（站與站之間，橘色＝移動） */
  .tln-move{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:relative;
    margin-left:7px; padding:7px 0 7px 26px; }
  .tln-move::before{ content:""; position:absolute; left:6px; top:0; bottom:0; width:2px;
    background:repeating-linear-gradient(var(--line) 0 5px, transparent 5px 10px); }
  .tln-move-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    color:var(--accent); background:#fbe9dd; border:1px solid #f0c9ae; padding:4px 12px; border-radius:999px; }
  .tln-move-q{ font-size:11px; color:var(--brand2); text-decoration:none; border:1px solid var(--line);
    padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .tln-move-q:hover{ background:var(--brand2); color:#fff; border-color:var(--brand2); }
  /* 站點卡片 */
  .tln-stop{ position:relative; padding:0 0 4px 26px; margin-left:7px; }
  .tln-stop::before{ content:""; position:absolute; left:6px; top:9px; bottom:-8px; width:2px; background:var(--line); }
  .tln-stop:last-child::before{ display:none; }
  .tln-stop .dotn{ position:absolute; left:0; top:9px; width:15px; height:15px; border-radius:50%;
    background:var(--brand); border:3px solid var(--bg); box-shadow:0 0 0 1.5px var(--brand); z-index:1; }
  .tln-card{ background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:11px 13px; box-shadow:0 1px 3px rgba(30,40,50,.05); }
  .tln-hd{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

  DB.trips.forEach(t=>{
    if(!('food'in t)){ t.food=[]; changed=true; }
    if(!('members'in t) || !Array.isArray(t.members) || !t.members.length){
      const n=Math.max(1, Number(t.people)||1);
      t.members=['我']; for(let i=2;i<=n;i++) t.members.push('同行 '+i);
      changed=true;
    }
    if(!('rates'in t) || typeof t.rates!=='object' || !t.rates){ t.rates={}; changed=true; }
    if(!('expenses'in t) || !Array.isArray(t.expenses)){ t.expenses=[]; changed=true; }
    if(!('stays'in t)){ t.stays={}; changed=true; }
    (t.food||[]).forEach(f=>{
      if(!('rating'in f)){ f.rating=null; changed=true; }
      if(!('price'in f)){ f.price=''; changed=true; }
    });
    t.days.forEach(d=>{
      if(!('stops'in d)){ d.stops=[]; changed=true; }
      if(!('area'in d)){ d.area=''; changed=true; }
      if(!('city'in d)){ d.city=''; changed=true; }
      (d.stops||[]).forEach(sp=>{
        if(!('time'in sp)){ sp.time=''; changed=true; }
        if(!('move'in sp)){ sp.move=''; changed=true; }
        if(!('moveMode'in sp)){ sp.moveMode='transit'; changed=true; }
        if(!('stay'in sp)){ sp.stay=''; changed=true; }
        if(!('desc'in sp)){ sp.desc=''; changed=true; }
        if(!sp.desc){ const dsc=lookupDesc(sp.name); if(dsc){ sp.desc=dsc; changed=true; } }
      });
    });
  });
  const st=DB.trips.find(t=>t.id===SEED.id);
  if(st){
    st.days.forEach(d=>{
      const sd=SEED.days.find(x=>x.date===d.date); if(!sd)return;
      if(!d.stops||!d.stops.length){ if(sd.stops&&sd.stops.length){ d.stops=deepcopy(sd.stops); changed=true; } }
      if(!d.area && sd.area){ d.area=sd.area; changed=true; }
      if(!d.city && sd.city){ d.city=sd.city; changed=true; }
    });
    if((!st.food||!st.food.length) && SEED.food && SEED.food.length){ st.food=deepcopy(SEED.food); changed=true; }
    // 回填既有美食的參考評分/價位（依 id 或店名對應種子）
    (st.food||[]).forEach(f=>{
      if(f.rating==null || !f.price){
        const sf=(SEED.food||[]).find(x=>x.id===f.id||x.name===f.name);
        if(sf){ if(f.rating==null && sf.rating!=null){f.rating=sf.rating;changed=true;}
                if(!f.price && sf.price){f.price=sf.price;changed=true;} }
      }
    });
    if((!st.stays||!Object.keys(st.stays).length) && SEED.stays && Object.keys(SEED.stays).length){
      st.stays=deepcopy(SEED.stays); changed=true;
    }
  }
  if(changed)save();
}

function fmtDate(s){ const d=new Date(s+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate()+' (週'+WD[d.getDay()]+')'; }
function money(n){ return n==null?'—':n.toLocaleString('en-US'); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function haversine(la1,lo1,la2,lo2){
  const R=6371,r=x=>x*Math.PI/180,dla=r(la2-la1),dlo=r(lo2-lo1);
  const h=Math.sin(dla/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function locateFood(){
  if(!navigator.geolocation){ toast('此裝置不支援定位'); return; }
  toast('定位中…');
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude, lo=p.coords.longitude;
    let best=null,bd=Infinity;
    for(const c in AREAS){ const d=haversine(la,lo,AREAS[c][0],AREAS[c][1]); if(d<bd){bd=d;best=c;} }
    if(best && (trip().food||[]).some(f=>f.area===best)){
      foodFilter=best; setTab('food'); renderFood();
      toast('已定位：'+best+'（約 '+Math.round(bd)+' km）');
    } else { toast('附近沒有對應的美食清單'); }
  }, e=>{ toast(e.code===1?'請允許定位權限':'定位失敗，訊號不足'); }, {timeout:8000, maximumAge:60000});
}

  const name=val('nf_name'); if(!name){ toast('請輸入店名'); return; }

function lookupDesc(name){
  if(!name) return '';
  const n=name.toLowerCase();
  for(const e of DESC_DB){ if(e.k.some(k=>n.includes(k.toLowerCase()))) return e.d; }
  return '';
}
const MOVE_ICON={walk:'🚶',transit:'🚆',cable:'🚠',drive:'🚗',flight:'✈️',boat:'⛴️'};
const MOVE_LABEL={walk:'步行',transit:'大眾運輸',cable:'纜車',drive:'開車',flight:'航班',boat:'渡輪'};
const MOVE_HINT={walk:'步行會自動估，可留空',transit:'例：地鐵 20min',cable:'例：纜車 25min',drive:'例：開車 30min',flight:'例：航班 3h40m',boat:'例：渡輪 40min'};
const MOVE_GMODE={walk:'walking',transit:'transit',cable:'transit',drive:'driving',flight:'transit',boat:'transit'};

// 走路自動估：兩點經緯度 → 分鐘（1.35 路網係數、時速 4.8km）
function walkMins(a,b){
  if(!a||!b||a.lat==null||b.lat==null) return null;
  const straight=haversine(a.lat,a.lng,b.lat,b.lng);
  if(!(straight>=0) || straight>8) return null;   // 超過 8 公里就不會是「走過去」，多半是座標查錯
  return Math.max(1, Math.round(straight*1.35/4.8*60));
}
// 用 OpenStreetMap 免費地理編碼把地點轉成經緯度（快取，失敗就跳過）
/* 站點座標：一律走 geoFetch（有查詢字備援、內建已驗證座標），
   而且**不再把座標寫回行程資料** —— 舊版會把查錯的座標存進 stops，
   包括查不到時寫入的 (0,0)（幾內亞灣外海），導致步行估算出現幾萬分鐘的荒謬數字。
   資料裡殘留的 lat/lng/_autowalk 一律忽略。 */
async function geocode(st){
  if(!st) return null;
  const q=(st.q||st.name||'').trim();
  if(!q) return null;
  const v=await geoFetch(q);
  return (v && v.lat!=null && !(v.lat===0 && v.lng===0)) ? v : null;
}
// 背景把某天所有「步行段」的通勤時間估好，完成後刷新畫面
let _estimating=false;
async function estimateWalks(i){
  if(_estimating) return; _estimating=true;
  try{
    const d=trip().days[i]; const s=d.stops||[]; let any=false;
    for(let k=1;k<s.length;k++){
      const wkey=i+':'+k;
      if(s[k].moveMode==='walk' && !s[k].move && WALK[wkey]===undefined){
        const a=await geocode(s[k-1]), b=await geocode(s[k]);
        const m=walkMins(a,b);
        WALK[wkey] = m!=null? m : 0;
        if(m!=null) any=true;
      }
    }
    const dm=document.getElementById('dayModal');
    if(any && dm && dm.classList.contains('on')) openDay(i);
  }finally{ _estimating=false; }
}

function refreshStopEditor(){ const el=document.getElementById('stopEditorWrap'); if(el) el.innerHTML=stopEditorHtml(); }
function addStop(){ _edStops.push({name:'',q:'',time:'',move:'',moveMode:'transit',stay:'',desc:''}); refreshStopEditor(); }
function delStop(i){ _edStops.splice(i,1); refreshStopEditor(); }
function moveStop(i,dir){ const j=i+dir; if(j<0||j>=_edStops.length) return;
  const t=_edStops[i]; _edStops[i]=_edStops[j]; _edStops[j]=t; refreshStopEditor(); }
function queryMove(i){
  if(i<1) return;
  const a=_edStops[i-1].q||_edStops[i-1].name, b=_edStops[i].q||_edStops[i].name;
  if(!a||!b){ toast('前後兩站都要先填地點'); return; }
  window.open(mapsUrl(a,b,MOVE_GMODE[_edStops[i].moveMode]||'transit'),'_blank');
  toast('看到時間後，填回「通勤時間」欄');
}
function setMoveMode(i,v){
  _edStops[i].moveMode=v;
  var l=document.getElementById('ml_'+i); if(l) l.textContent=(MOVE_ICON[v]||'')+' '+(MOVE_LABEL[v]||'')+'・從上一站到這站';
  var m=document.getElementById('mv_'+i); if(m) m.placeholder=MOVE_HINT[v]||'';
}

// 依抵達時刻判斷時段：<12 上午、12–18 下午、>=18 晚上
function periodOf(time){
  const m=/^\s*(\d{1,2})/.exec(time||''); if(!m) return null;
  const h=+m[1]; if(h<12) return 'am'; if(h<18) return 'pm'; return 'ev';
}
function routeSection(d){
  const s=d.stops||[];
  if(!s.length){
    return `<div class="routewrap"><h3>🧭 行程時間軸</h3>
      <div class="empty">這天還沒設定站點，點下方「✏️ 編輯這天」新增。</div></div>`;
  }
  const idx=trip().days.indexOf(d);
  const PERIOD={am:'🌅 上午',pm:'☀️ 下午',ev:'🌙 晚上'};
  let lastP=null, items='';
  s.forEach((st,i)=>{
    let p=periodOf(st.time); if(p===null) p=lastP||'am';
    if(p!==lastP){ items+=`<div class="tln-period p-${p}">${PERIOD[p]}</div>`; lastP=p; }
    if(i>0){
      const mode=st.moveMode||'transit';
      const a=s[i-1].q||s[i-1].name, b=st.q||st.name;
      let mv=st.move;
      if(!mv && mode==='walk' && WALK[idx+':'+i]) mv='約 '+WALK[idx+':'+i]+' 分（步行估）';
      items+=`<div class="tln-move"><span class="tln-move-pill">${MOVE_ICON[mode]||'🚆'} ${mv?esc(mv):(MOVE_LABEL[mode]||'交通')}</span>`+
        `<a class="tln-move-q" href="${mapsUrl(a,b,MOVE_GMODE[mode]||'transit')}" target="_blank" rel="noopener">🔎 查交通</a></div>`;
    }
    const time = st.time? `<div class="tln-arrive"><span class="tln-time">🕓 ${esc(st.time)} 抵達</span></div>`:'';
    const stay = st.stay? `<span class="tln-stay">⏱ 停留 ${esc(st.stay)}</span>`:'';
    const map = `<a class="tln-map" href="${mapsSearch(st.q||st.name)}" target="_blank" rel="noopener">📍 地圖</a>`;
    const badges = (stay||map)? `<div class="tln-badges">${stay}${map}</div>`:'';
    const desc = st.desc? `<div class="tln-desc clip" onclick="this.classList.toggle('clip');this.nextElementSibling.textContent=this.classList.contains('clip')?'▾ 展開介紹':'▴ 收合';">${esc(st.desc)}</div>`+
      `<span class="tln-more" onclick="var pp=this.previousElementSibling;pp.classList.toggle('clip');this.textContent=pp.classList.contains('clip')?'▾ 展開介紹':'▴ 收合';">▾ 展開介紹</span>`:'';
    items+=`<div class="tln-stop${st.time?' hastime':''}"><span class="dotn"></span>`+
      `<div class="tln-card">${time}<div class="tln-hd"><span class="tln-name">${esc(st.name)}</span></div>${badges}${desc}</div></div>`;
  });
  setTimeout(()=>estimateWalks(idx),60);
  return `<div class="routewrap"><h3>🧭 行程時間軸</h3>
    <div class="tln-legend"><span class="lg lg-move">通勤</span><span class="lg lg-stay">停留</span></div>
    <div class="tln">${items}</div></div>`;
}

function saveDay(i){
  const d=trip().days[i];
  d.title=val('e_title');
  d.lodging=val('e_lodge'); d.link=val('e_link'); d.area=val('e_area'); d.city=val('e_city');
  d.lodgeCook=(document.getElementById('e_cook')||{}).checked||false;
  d.lodgeBfast=(document.getElementById('e_bfast')||{}).checked||false;
  d.lodgeShuttle=(document.getElementById('e_shuttle')||{}).checked||false;
  const p=val('e_price'); d.price = p===''?null:Number(p);
  d.stops = _edStops.filter(s=>(s.name||'').trim()).map(s=>{
    const name=(s.name||'').trim();
    let q=(s.q||'').trim(); if(!q) q = d.area? name+' '+d.area : name;
    return {name, q, time:(s.time||'').trim(), move:(s.move||'').trim(),
      moveMode:s.moveMode||'transit', stay:(s.stay||'').trim(), desc:(s.desc||'').trim()};
  });
  save(); renderAll(); openDay(i); toast('已儲存');
}
function val(id){ return document.getElementById(id).value.trim(); }

/* ---------- cost ---------- */
function renderCost(){
  const t=trip(); const v=document.getElementById('view-cost');
  const dayTotal=t.days.reduce((a,d)=>a+(d.price||0),0);
  const todos=t.todos||[];
  const todoCost=todos.reduce((a,x)=>a+(Number(x.cost)||0),0);
  const total=dayTotal+todoCost;
  const per = t.people? Math.round(total/t.people):total;
  const rows=t.days.map((d,i)=>{
    const has=d.price!=null;
    return `<div class="row"><div class="l"><span class="d">Day ${i+1} · ${esc(d.title||'行程')}</span>`+
      `<span class="s">${fmtDate(d.date)}${d.lodging?' · '+esc(d.lodging):''}</span></div>`+
      `<span class="amt ${has?'':'none'}">${has?'$'+money(d.price):'—'}</span></div>`;
  }).join('');
  const todoRows=todos.filter(x=>Number(x.cost)>0).map(x=>
    `<div class="row"><div class="l"><span class="d">${x.done?'✓ ':''}🎫 ${esc(x.text)}</span></div>`+
    `<span class="amt">$${money(x.cost)}</span></div>`

  v.innerHTML=`
    <div class="bigstat">
      <div class="stat"><div class="k">總花費</div><div class="v accent">$${money(total)}</div><div class="u">${t.currency}</div></div>
      <div class="stat"><div class="k">每人分攤（${t.people} 人）</div><div class="v">$${money(per)}</div><div class="u">${t.currency}／人</div></div>
    </div>
    <div class="card">
      <div class="checkhd"><h3>💰 各日花費明細</h3><span style="font-size:13px;color:var(--muted);font-weight:700">$${money(dayTotal)}</span></div>
      <div class="costlist">${rows}</div>
    </div>
    <div class="card">
      <div class="checkhd"><h3>🎫 待辦／票券花費</h3><span style="font-size:13px;color:var(--muted);font-weight:700">$${money(todoCost)}</span></div>
      <div class="costlist">${todoRows}</div>
    </div>
    <div class="hint">＊「各日花費」來自各天的「當日花費」；「待辦／票券花費」來自「清單」頁填的金額。兩者合計＝總花費。</div>`;
}

function checkBlock(key,title,ph,withCost){
  const list=trip()[key]||[];
  const done=list.filter(x=>x.done).length;
  const pct=list.length?Math.round(done/list.length*100):0;
  const sub=withCost?list.reduce((a,x)=>a+(Number(x.cost)||0),0):0;
  const red=list.filter(x=>!x.done&&x.pri==1).length;
  const items=list.map((x,i)=>`
    <div class="chkitem ${x.done?'done':''}">
      <div class="box" onclick="toggleChk('${key}',${i})">${x.done?'✓':''}</div>
      <div class="t" onclick="toggleChk('${key}',${i})">${!x.done&&x.pri?`<span class="pri">${x.pri==1?'🔴':'🟡'}</span>`:''}${esc(x.text)}</div>
      ${withCost?`<input class="chkcost" type="number" value="${x.cost!=null?x.cost:''}" placeholder="金額" onclick="event.stopPropagation()" onchange="setChkCost('${key}',${i},this.value)">`:''}
      <button class="prib" title="切換燈號：🔴急 → 🟡建議 → ⚪無" onclick="event.stopPropagation();cyclePri('${key}',${i})">${x.pri==1?'🔴':x.pri==2?'🟡':'⚪'}</button>
      <button class="del" onclick="delChk('${key}',${i})">🗑</button>
    </div>`).join('') || '<div class="hint">還沒有項目，從下面新增。</div>';
  return `<div class="card">
    <div class="checkhd"><h3>${title}</h3><span style="font-size:13px;color:var(--muted);font-weight:700">${done}/${list.length}${red?` · 🔴 ${red}`:''}${withCost&&sub?` · 💰 $${money(sub)}`:''}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    ${items}
    <div class="addrow">
      <input id="add_${key}" placeholder="${ph}" onkeydown="if(event.key==='Enter')addChk('${key}')">
      <button onclick="addChk('${key}')">＋ 加入</button>
    </div>
    ${withCost?'<div class="hint" style="margin-top:8px">💡 車票、保險、門票等有花費的項目，在右邊填金額，會自動加進「費用」頁的總花費。</div>':''}
  </div>`;
}
function cyclePri(key,i){ const x=trip()[key][i]; x.pri = x.pri==1?2:(x.pri==2?null:1); save(); renderCheck(); }
function toggleChk(key,i){ trip()[key][i].done=!trip()[key][i].done; save(); renderCheck(); }
function delChk(key,i){ trip()[key].splice(i,1); save(); renderCheck(); }
function addChk(key){
  const inp=document.getElementById('add_'+key); const txt=inp.value.trim();
  if(!txt)return; if(!trip()[key])trip()[key]=[];
  trip()[key].push({text:txt,done:false,cost:null}); save(); renderCheck();
}
function setChkCost(key,i,val){ trip()[key][i].cost = val===''?null:(Number(val)||0); save(); renderCheck(); renderCost(); }

function createTrip(){
  const name=val('n_name'); if(!name){ toast('請輸入行程名稱'); return; }
  const s=val('n_start'), e=val('n_end');
  if(!s||!e){ toast('請選擇出發與結束日'); return; }
  const days=[]; let d=new Date(s+'T00:00:00'), end=new Date(e+'T00:00:00');
  if(end<d){ toast('結束日不能早於出發日'); return; }
  let n=1;
  while(d<=end){
    const iso=d.toISOString().slice(0,10);
    days.push({date:iso,title:'第 '+n+' 天',morning:'',afternoon:'',evening:'',lodging:'',link:'',price:null,area:'',city:'',stops:[]});
    d.setDate(d.getDate()+1); n++;
  }
  const t={id:slug(),name:name,subtitle:val('n_sub'),people:Number(val('n_ppl'))||1,
    currency:val('n_cur')||'TWD',days:days,todos:[],packing:[],food:[],stays:{}};
  DB.trips.push(t); activeId=t.id; save();
  closeModal('manageModal'); renderAll(); setTab('itin'); toast('已建立：'+name);
}
function switchTrip(id){ activeId=id; save(); renderAll(); }
function delTrip(id){
  if(DB.trips.length<=1){ toast('至少保留一趟行程'); return; }
  const t=DB.trips.find(x=>x.id===id);
  if(!confirm('確定刪除「'+t.name+'」？此動作無法復原。'))return;
  DB.trips=DB.trips.filter(x=>x.id!==id);
  if(activeId===id)activeId=DB.trips[0].id;
  save(); openManage(); renderAll();
}
function exportTrip(){
  const t=trip(); const blob=new Blob([JSON.stringify(t,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(t.name||'trip').replace(/[\\/:*?"<>|]/g,'_')+'.json'; a.click();
  toast('已匯出 JSON');
}
function importFile(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const t=JSON.parse(r.result);
      if(!t.days||!Array.isArray(t.days)) throw 0;
      t.id=slug(); t.todos=t.todos||[]; t.packing=t.packing||[];
      t.people=t.people||1; t.currency=t.currency||'TWD';
      DB.trips.push(t); activeId=t.id; save();
      closeModal('manageModal'); renderAll(); setTab('itin'); toast('已匯入：'+(t.name||'行程'));
    }catch(e){ toast('檔案格式不正確'); }
    ev.target.value='';
  };
  r.readAsText(f);
}

const GEO_KEY='travel_geo_v1';
let GEO=null;
function geoLoad(){
  if(GEO) return GEO;
  let saved={};
  try{ saved=JSON.parse(localStorage.getItem(GEO_KEY))||{}; }catch(e){}
  GEO=Object.assign({}, BUILTIN_GEO, saved);   // 內建為底，自己查過的優先
  return GEO;
}
function geoSave(){ try{ localStorage.setItem(GEO_KEY, JSON.stringify(geoLoad())); }catch(e){} }
/* 查詢字備援：中英混寫（「Montreux車站」）、地址帶店名（「Angelina, ...75008 Paris」）
   這類字串直接查常常失敗、甚至查到別國同名的地方，所以依序換幾種寫法再試 */
const GEO_CJK=/[　-〿一-鿿＀-￯]/g;
const GEO_SUFFIX=/(train station|railway station|車站|觀景台|站台)/ig;
function geoVariants(q){
  const v=[q];
  const push=s=>{ s=(s||'').replace(/\s+/g,' ').trim().replace(/^[,\s]+|[,\s]+$/g,''); if(s&&v.indexOf(s)<0) v.push(s); };
  const base=q.replace(GEO_SUFFIX,' ');
  push(base);
  const latin=base.replace(GEO_CJK,' ');
  if(/[A-Za-z]/.test(latin)) push(latin);          // 只剩數字的（如郵遞區號）不採用，會查到別國
  const cjk=(base.match(new RegExp(GEO_CJK.source+'+','g'))||[]).join(' ');
  push(cjk);
  const seg=base.split(',').map(s=>s.trim()).filter(Boolean);
  if(seg.length>1) push(seg[0]+' '+seg[seg.length-1]);   // 店名 + 城市，避免抓到同名的外國地點
  return v;
}
async function geoOne(s){
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=zh-TW,en&q='+encodeURIComponent(s));
    const j=await r.json();
    if(j&&j[0]) return {lat:+j[0].lat, lng:+j[0].lon};
  }catch(e){}
  return null;
}
async function geoFetch(q){
  const g=geoLoad();
  if(q in g) return g[q];
  const cm=(''+q).match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);  // 直接填經緯度
  if(cm){ g[q]={lat:+cm[1],lng:+cm[2]}; geoSave(); return g[q]; }
  let hit=null;
  const vs=geoVariants(q);
  for(let i=0;i<vs.length && !hit;i++){
    if(i) await new Promise(r=>setTimeout(r,1100));   // 遵守 OSM 每秒一次的規範
    hit=await geoOne(vs[i]);
  }
  g[q]= hit || {lat:null,lng:null};
  geoSave();
  return g[q];
}
// 蒐集要標在地圖上的點（每個站點一筆）
function mapTargets(){
  const out=[];
  (trip().days||[]).forEach((d,i)=>{
    (d.stops||[]).forEach(s=>{
      const q=(s.q||s.name||'').trim();
      if(q) out.push({q:q, name:s.name||q, city:(d.city||'').trim(), day:i+1, mode:s.moveMode||'transit'});
    });
  });
  return out;
}
// 依 Nominatim 的使用規範，一秒一個慢慢查；查過的存快取，第二次匯出就不用等
async function ensureGeo(onProgress){
  const list=mapTargets(), g=geoLoad();
  const todo=[...new Set(list.map(x=>x.q))].filter(q=>!(q in g));
  for(let i=0;i<todo.length;i++){
    if(onProgress) onProgress(i+1, todo.length);
    await geoFetch(todo[i]);
    if(i<todo.length-1) await new Promise(r=>setTimeout(r,1100));
  }
  return todo.length;
}

function textW(s,size){                        // 粗估字寬：中日文一格、英數半格（估寬一點，寧可留空也不要擦到）
  let w=0; for(const ch of s){ w += /[\x00-\xff]/.test(ch)? size*0.6 : size*1.04; }
  return w;
}
/* 把相距 600 km 以內的點串成同一群，只保留夠大的群。
   同名地點被查到別的國家時（例如「策馬特車站」對到黑龍江同名地），
   會變成孤零零一個點，把整張地圖的比例尺撐爆 —— 這裡直接濾掉。 */
function geoClusters(pts, linkKm){
  const par=pts.map((_,i)=>i);
  const find=i=>{ while(par[i]!==i){ par[i]=par[par[i]]; i=par[i]; } return i; };
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    if(haversine(pts[i].lat,pts[i].lng,pts[j].lat,pts[j].lng)<=linkKm){
      const a=find(i), b=find(j); if(a!==b) par[a]=b;
    }
  }
  const groups={};
  pts.forEach((p,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(p); });
  return Object.values(groups).sort((a,b)=>b.length-a.length);
}

  for(let i=1;i<s.length;i++){
    const m=s[i].moveMode;
    if(m && m!=='walk') return m;
  }
  return null;
}
// 城市 A → 城市 B 這段用的交通方式：看抵達 B 的那一天
function legMode(fromCity, toCity){
  const days=trip().days||[];
  for(let i=0;i<days.length;i++){
    if((days[i].city||'').trim()===toCity && i>0 && (days[i-1].city||'').trim()===fromCity){
      return dayMoveMode(days[i]) || 'transit';
    }
  }
  for(let i=0;i<days.length;i++){
    if((days[i].city||'').trim()===toCity) return dayMoveMode(days[i]) || 'transit';
  }
  return 'transit';
}

/* 實際走過的長程路段：把每天站點依序串起來，只取距離夠遠的那幾段。
   這樣像「巴黎當天來回聖米歇爾山」這種一日遠征也會畫出來，
   不會因為它掛在巴黎底下就被當成市區景點漏掉。 */
function tripLegs(minKm){
  const g=geoLoad(), legs=[], seen={};
  const pos=st=>{
    const q=(st.q||st.name||'').trim(), v=g[q];
    return (v && v.lat!=null && !(v.lat===0&&v.lng===0))
      ? {lat:v.lat, lng:v.lng, mode:st.moveMode||'transit', name:st.name||q} : null;
  };
  let prev=null;
  (trip().days||[]).forEach(d=>{
    (d.stops||[]).forEach(st=>{
      const cur=pos(st);
      if(prev && cur){
        const km=haversine(prev.lat,prev.lng,cur.lat,cur.lng);
        if(km>=minKm){
          // 來回同一段只畫一次
          const key=[prev.lat.toFixed(2)+','+prev.lng.toFixed(2), cur.lat.toFixed(2)+','+cur.lng.toFixed(2)].sort().join('|');
          if(!seen[key]){ seen[key]=1; legs.push({a:prev, b:cur, mode:cur.mode, km:km}); }
        }
      }
      if(cur) prev=cur;
    });
  });
  return legs;
}

/* 畫一張地圖：國界底圖 + 地點 + 路線 + 交通符號。
   opts.mode='detail' 標到景點層級；'overview' 只標城市與跨區航線 */
function prMapCanvas(pts, opts){
  opts=opts||{};
  const W=620, PAD=16;
  const latAll=pts.map(p=>p.lat), lngAll=pts.map(p=>p.lng);
  let minLat=Math.min(...latAll), maxLat=Math.max(...latAll);
  let minLng=Math.min(...lngAll), maxLng=Math.max(...lngAll);
  const padLat=Math.max((maxLat-minLat)*0.28, 0.9);
  const padLng=Math.max((maxLng-minLng)*0.16, 1.2);
  minLat-=padLat; maxLat+=padLat; minLng-=padLng; maxLng+=padLng;

  const latM=(minLat+maxLat)/2, kx=Math.cos(latM*Math.PI/180);
  const spanX=(maxLng-minLng)*kx || 1e-6, spanY=(maxLat-minLat) || 1e-6;
  let sc=(W-PAD*2)/spanX;
  let H=spanY*sc+PAD*2;
  const MAXH=opts.maxH||430;
  if(H>MAXH){ H=MAXH; sc=(H-PAD*2)/spanY; }
  H=Math.max(160, Math.round(H));
  const offX=(W-spanX*sc)/2, offY=(H-spanY*sc)/2;
  const X=lng=>offX+(lng-minLng)*kx*sc;
  const Y=lat=>offY+(maxLat-lat)*sc;

  // 國界：只畫和目前視窗有交集的
  let land='', cLabels=[];
  for(const name in WORLD){
    for(const s of WORLD[name]){
      const a=s.split(' ');
      let n0=1e9,n1=-1e9,t0=1e9,t1=-1e9, dd='';
      for(let i=0;i<a.length;i+=2){
        const lng=+a[i]/100, lat=+a[i+1]/100;
        if(lng<n0)n0=lng; if(lng>n1)n1=lng; if(lat<t0)t0=lat; if(lat>t1)t1=lat;
        dd+=(i?'L':'M')+X(lng).toFixed(1)+' '+Y(lat).toFixed(1)+' ';
      }
      if(n1<minLng||n0>maxLng||t1<minLat||t0>maxLat) continue;
      land+=`<path d="${dd}Z" fill="#ece5da" stroke="#cfc4b4" stroke-width=".7"/>`;
      cLabels.push({name:name, lng:(n0+n1)/2, lat:(t0+t1)/2, w:(n1-n0)*kx*sc});
    }
  }

  const boxes=[];
  const fits=(x,y,w,h)=>{
    const r={x1:x-2,y1:y-1.5,x2:x+w+2,y2:y+h+1.5};
    if(r.x1<2||r.x2>W-2||r.y1<2||r.y2>H-2) return false;
    for(const b of boxes){ if(!(r.x2<b.x1||r.x1>b.x2||r.y2<b.y1||r.y1>b.y2)) return false; }
    boxes.push(r); return true;
  };


  // 城市點（依造訪順序連線）
  const cityPts=opts.cityPts||[];
  const seq=opts.seq||[];
  let route='', modes='';
  // 有實際路段就照實際走法畫，沒有才退回用城市順序連線
  const segs=[];
  if(opts.legs && opts.legs.length){
    opts.legs.forEach(l=>segs.push({a:l.a, b:l.b, mode:l.mode, km:l.km}));
  }else{
    for(let i=1;i<seq.length;i++){
      const a=cityPts.find(c=>c.name===seq[i-1]), b=cityPts.find(c=>c.name===seq[i]);
      if(a&&b) segs.push({a:a, b:b, mode:legMode(seq[i-1],seq[i]),
        km:haversine(a.lat,a.lng,b.lat,b.lng)});
    }
  }
  const inView=p=>p.lng>=minLng&&p.lng<=maxLng&&p.lat>=minLat&&p.lat<=maxLat;
  segs.forEach(sg=>{
    // 兩端都要在這張圖的範圍內，不然像台灣→巴黎那段會拖出一條沒頭沒尾的線
    if(!inView(sg.a)||!inView(sg.b)) return;
    const x1=X(sg.a.lng), y1=Y(sg.a.lat), x2=X(sg.b.lng), y2=Y(sg.b.lat);
    route+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none"
      stroke="#c8622d" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round" opacity=".6"/>`;
    // 隔著一整個大陸的那段一定是飛的，不管資料怎麼記
    const em=MOVE_EMOJI[sg.km>1500? 'flight' : sg.mode]||'🚆';
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    modes+=`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="9" fill="#fff" stroke="#e6dccd" stroke-width="1"/>`+
      `<text x="${mx.toFixed(1)}" y="${(my+4).toFixed(1)}" font-size="10" text-anchor="middle">${em}</text>`;
    boxes.push({x1:mx-11,y1:my-11,x2:mx+11,y2:my+11});
  });

  let dots='', special='', labels='', shown=0, uniqPts=[];
  if(opts.mode!=='overview'){
    pts.forEach(p=>{
      const x=X(p.lng), y=Y(p.lat);
      // 纜車、渡輪、航班這種特別的抵達方式，直接用符號取代小圓點
      if(p.mode==='cable'||p.mode==='boat'||p.mode==='flight'){
        // 畫在最上層，不然會被城市大點蓋掉；真的重疊時往右上讓開並拉一條細線標示原位置
        let sx=x, sy=y, lead='';
        for(const c of cityPts){
          const cx=X(c.lng), cy=Y(c.lat);
          if(Math.abs(x-cx)<13 && Math.abs(y-cy)<13){
            sx=x+14; sy=y-12;
            lead=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${sx.toFixed(1)}" y2="${sy.toFixed(1)}"
              stroke="#cbbfae" stroke-width=".8"/>`;
            break;
          }
        }
        special+=lead+`<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="7.5" fill="#fff" stroke="#e6dccd" stroke-width="1"/>`+
          `<text x="${sx.toFixed(1)}" y="${(sy+3.2).toFixed(1)}" font-size="9" text-anchor="middle">${MOVE_EMOJI[p.mode]}</text>`;
        boxes.push({x1:sx-9,y1:sy-9,x2:sx+9,y2:sy+9});
      }else{
        dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="#9c9082"/>`;
        boxes.push({x1:x-3,y1:y-3,x2:x+3,y2:y+3});
      }
    });
  }
  cityPts.forEach(c=>{ const x=X(c.lng), y=Y(c.lat); boxes.push({x1:x-7,y1:y-7,x2:x+7,y2:y+7}); });

  let cities='';
  cityPts.forEach(c=>{
    const x=X(c.lng), y=Y(c.lat), n=seq.indexOf(c.name)+1;
    cities+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="#fff"/>`+
            `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#c8622d"/>`;
    if(n>0) cities+=`<text x="${x.toFixed(1)}" y="${(y+2.6).toFixed(1)}" font-size="7" font-weight="700"
      fill="#fff" text-anchor="middle">${n}</text>`;
    const label=c.days&&c.days.length
      ? c.name+'（Day '+(c.days.length>1? c.days[0]+'-'+c.days[c.days.length-1] : c.days[0])+'）'
      : c.name;
    // 城市名一定要看得到：正常字級放不下就縮一號再試一輪
    for(const fs of [11.5, 9.5]){
      const w=textW(label,fs), h=fs+3;
      const cands=[[x-w/2,y-h-11],[x-w/2,y+12],[x+12,y-h/2],[x-w-12,y-h/2],
                   [x+10,y+9],[x-w-10,y+9],[x+10,y-h-9],[x-w-10,y-h-9],
                   [x-w/2,y-h-22],[x-w/2,y+23]];
      let done=false;
      for(const [lx,ly] of cands){
        if(fits(lx,ly,w,h)){
          cities+=`<text x="${lx.toFixed(1)}" y="${(ly+fs-1).toFixed(1)}" font-size="${fs}" font-weight="800"
            fill="#1c1a17">${esc(label)}</text>`;
          done=true; break;
        }
      }
      if(done) break;
    }
  });

  // 國名最後才放：城市名的位置優先，擠不下時寧可不標國名
  // 國名：只標輪廓夠寬的，淡淡地墊在底下
  let names='';
  const seenC={};
  cLabels.sort((a,b)=>b.w-a.w).forEach(c=>{
    if(c.w < W*0.11 || seenC[c.name]) return;
    const fs=13, w=textW(c.name,fs), x=X(c.lng)-w/2, y=Y(c.lat)-fs/2;
    if(!fits(x,y,w,fs)) return;      // 城市名已經先放好了，撞到就不標國名
    seenC[c.name]=1;
    names+=`<text x="${x.toFixed(1)}" y="${(y+fs-2).toFixed(1)}" font-size="${fs}" font-weight="800"
      fill="#b9ad9c" letter-spacing="2">${esc(c.name)}</text>`;
  });

  if(opts.mode!=='overview'){
    const seen=new Set();
    uniqPts=pts.filter(p=>{ if(seen.has(p.name)) return false; seen.add(p.name); return true; });
    uniqPts.forEach(p=>{
      const x=X(p.lng), y=Y(p.lat), fs=7.6, w=textW(p.name,fs), h=fs+2;
      const cands=[[x+7,y-h/2],[x-w-7,y-h/2],[x-w/2,y-h-6],[x-w/2,y+7]];
      for(const [lx,ly] of cands){
        if(fits(lx,ly,w,h)){
          labels+=`<text x="${lx.toFixed(1)}" y="${(ly+fs-1).toFixed(1)}" font-size="${fs}"
            fill="#5d564e">${esc(p.name)}</text>`;
          shown++; break;
        }
      }
    });
  }

  const svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="mc${opts.id||0}"><rect x="0" y="0" width="${W}" height="${H}" rx="10"/></clipPath></defs>
    <g clip-path="url(#mc${opts.id||0})">
      <rect x="0" y="0" width="${W}" height="${H}" fill="#f7f4ee"/>
      ${land}${names}${route}${dots}${cities}${modes}${special}${labels}
    </g></svg>`;
  return {svg:svg, shown:shown, total:uniqPts.length};
}

/* 城市放大圖：在法國＋瑞士那個尺度下，巴黎市區的景點會全部疊成一個點，
   所以每個城市另外畫一張放大圖，才看得出羅浮宮在東、凱旋門在西這種關係。 */
let _cmId=0;
function prCityMap(name, pts, depth){
  depth=depth||0;
  const _cmIdLocal=++_cmId;
  if(pts.length<2) return {html:'', missed:[]};
  let cut=0;
  if(depth===0){
    // 機場、郊區車站離市區太遠，會把市區景點全擠成一坨；先以中位位置為準把它們排除
    const mid=a=>{ const s=[...a].sort((m,n)=>m-n), h=s.length>>1; return s.length%2? s[h]:(s[h-1]+s[h])/2; };
    const cLat=mid(pts.map(p=>p.lat)), cLng=mid(pts.map(p=>p.lng));
    const near=pts.filter(p=>haversine(p.lat,p.lng,cLat,cLng)<=15);
    cut=pts.length-near.length;
    if(near.length>=2) pts=near;
  }
  if(pts.length<2) return {html:'', missed:[]};
  const W=290, PAD=13;
  const lats=pts.map(p=>p.lat), lngs=pts.map(p=>p.lng);
  let minLat=Math.min(...lats), maxLat=Math.max(...lats);
  let minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
  const padLat=Math.max((maxLat-minLat)*0.22, 0.004);
  const padLng=Math.max((maxLng-minLng)*0.12, 0.006);
  minLat-=padLat; maxLat+=padLat; minLng-=padLng; maxLng+=padLng;
  const kx=Math.cos((minLat+maxLat)/2*Math.PI/180);
  const spanX=(maxLng-minLng)*kx||1e-6, spanY=(maxLat-minLat)||1e-6;
  let sc=(W-PAD*2)/spanX;
  let H=spanY*sc+PAD*2;
  if(H>230){ H=230; sc=(H-PAD*2)/spanY; }
  if(H<120){ H=120; }
  H=Math.round(H);
  const offX=(W-spanX*sc)/2, offY=(H-spanY*sc)/2;
  const X=lng=>offX+(lng-minLng)*kx*sc, Y=lat=>offY+(maxLat-lat)*sc;

  const boxes=[];
  const fits=(x,y,w,h)=>{
    const r={x1:x-1.5,y1:y-1,x2:x+w+1.5,y2:y+h+1};
    if(r.x1<1||r.x2>W-1||r.y1<1||r.y2>H-1) return false;
    for(const b of boxes){ if(!(r.x2<b.x1||r.x1>b.x2||r.y2<b.y1||r.y1>b.y2)) return false; }
    boxes.push(r); return true;
  };

  let dots='', labels='', shown=0;
  const seen=new Set();
  const uniq=pts.filter(p=>{ if(seen.has(p.name)) return false; seen.add(p.name); return true; });
  uniq.forEach(p=>{ const x=X(p.lng), y=Y(p.lat); boxes.push({x1:x-2.5,y1:y-2.5,x2:x+2.5,y2:y+2.5}); });
  // 底圖：綠地 → 水系 → 道路 → 鐵路 → 纜車，一層層疊上去才像地圖
  const bkey=Object.keys(CITYBASE).find(k=>name.indexOf(k)===0);
  const layers=bkey? CITYBASE[bkey] : {};
  const toPath=raw=>{
    const a=raw.split(' ');
    let d='', any=false;
    for(let i=0;i<a.length;i+=2){
      const lng=+a[i]/10000, lat=+a[i+1]/10000;
      if(lng>=minLng&&lng<=maxLng&&lat>=minLat&&lat<=maxLat) any=true;
      d+=(i?'L':'M')+X(lng).toFixed(1)+' '+Y(lat).toFixed(1)+' ';
    }
    return any? {d:d, a:a} : null;
  };
  const draw=(kind, fn)=>{
    (layers[kind]||[]).forEach(raw=>{ const r=toPath(raw); if(r) land+=fn(r.d, r.a); });
  };
  let land='';
  draw('park', d=>`<path d="${d}Z" fill="#e2ece0" stroke="#cdddc9" stroke-width=".6"/>`);
  draw('water', (d,a)=>{
    // 只有真正封閉的環才填色；開放線段強制閉合會變成莫名其妙的大色塊
    const closed = a.length>=8 && a[0]===a[a.length-2] && a[1]===a[a.length-1];
    return closed? `<path d="${d}Z" fill="#dbe7ef" stroke="#c2d5e2" stroke-width=".7"/>`
                 : `<path d="${d}" fill="none" stroke="#b6d0e0" stroke-width="1.5" stroke-linecap="round"/>`;
  });
  Object.keys(layers).forEach(k=>{
    if(k.indexOf('lake@')!==0) return;
    const c=k.slice(5).split(',');
    draw(k, d=>`<path d="${d}L${X(+c[1]).toFixed(1)} ${Y(+c[0]).toFixed(1)} Z" fill="#dbe7ef" stroke="none"/>`+
               `<path d="${d}" fill="none" stroke="#9fc0d6" stroke-width="1.6" stroke-linecap="round"/>`);
  });
  draw('river', d=>`<path d="${d}" fill="none" stroke="#b6d0e0" stroke-width="1.5" stroke-linecap="round"/>`);
  draw('bigriver', d=>`<path d="${d}" fill="none" stroke="#cfe0ea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`+
                      `<path d="${d}" fill="none" stroke="#a9c8dc" stroke-width="1" stroke-linecap="round"/>`);
  draw('road', d=>`<path d="${d}" fill="none" stroke="#e6ddd0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`+
                  `<path d="${d}" fill="none" stroke="#fdfbf7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>`);
  draw('rail', d=>`<path d="${d}" fill="none" stroke="#b6ada1" stroke-width="1" stroke-dasharray="4 2.5"/>`);
  draw('aerial', d=>`<path d="${d}" fill="none" stroke="#9b8d7c" stroke-width=".9" stroke-dasharray="1.5 2.5"/>`);
  // 指北針
  const compass=`<g transform="translate(${(W-13).toFixed(1)},14)" opacity=".55">
    <path d="M0 -7 L3 4 L0 1.6 L-3 4 Z" fill="#8a7f73"/>
    <text x="0" y="11.5" font-size="5.5" fill="#8a7f73" text-anchor="middle" font-weight="700">N</text></g>`;

  const missed=[];
  uniq.forEach((p,i)=>{
    const x=X(p.lng), y=Y(p.lat);
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="#c8622d"/>`;
    // 放大圖裡名字過長會佔死版面，截短讓更多點標得到
    const full=p.name;
    const lim=depth>0? 18 : 24;
    const txt=full.length>lim? full.slice(0,lim-1)+'…' : full;
    const fs=7, w=textW(txt,fs), h=fs+1.5;
    const cands=[[x+5,y-h/2],[x-w-5,y-h/2],[x-w/2,y-h-4],[x-w/2,y+5],
                 [x+5,y+4],[x-w-5,y+4],[x+5,y-h-4],[x-w-5,y-h-4]];
    let ok=false;
    for(const [lx,ly] of cands){
      if(fits(lx,ly,w,h)){
        labels+=`<text x="${lx.toFixed(1)}" y="${(ly+fs-1).toFixed(1)}" font-size="${fs}"
          fill="#3d3832">${esc(txt)}</text>`;
        shown++; ok=true; break;
      }
    }
    if(!ok) missed.push(p);
  });
  // 比例尺：抓一個好看的整數公里
  // sc 是「每度經緯度幾 px」，1 度 ≈ 111.32 km（經度方向的 cos 修正已含在 sc 用法裡）
  const kmPerPx=111.32/sc;
  const cands=[0.2,0.5,1,2,5,10,20,50,100];
  // 取「畫得下的最長那根」，全都畫不下就用最短的
  const fitCands=cands.filter(k=>k/kmPerPx<=W*0.34);
  const barKm=fitCands.length? fitCands[fitCands.length-1] : cands[0];
  const barPx=Math.min(barKm/kmPerPx, W*0.34);
  const scale=`<g transform="translate(${(W-PAD-barPx).toFixed(1)},${(H-9).toFixed(1)})">
    <line x1="0" y1="0" x2="${barPx.toFixed(1)}" y2="0" stroke="#8a7f73" stroke-width="1.2"/>
    <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="#8a7f73" stroke-width="1.2"/>
    <line x1="${barPx.toFixed(1)}" y1="-2.5" x2="${barPx.toFixed(1)}" y2="2.5" stroke="#8a7f73" stroke-width="1.2"/>
    <text x="${(barPx/2).toFixed(1)}" y="-4" font-size="6.5" fill="#8a7f73" text-anchor="middle">${barKm} km</text></g>`;

  const html=`<div class="pr-citymap">
    <div class="pr-cmhd">${depth?'🔎':'📍'} ${esc(name)}<span>${uniq.length} 個地點${missed.length?`・${missed.length} 個未標名`:''}${cut?`・略過 ${cut} 個遠處`:''}</span></div>
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="cmclip${_cmIdLocal}"><rect x="0" y="0" width="${W}" height="${H}" rx="8"/></clipPath></defs>
      <rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="#f7f4ee"/>
      <g clip-path="url(#cmclip${_cmIdLocal})">${land}</g>
      ${dots}${labels}${scale}${compass}
    </svg></div>`;
  return {html:html, missed:missed, span:Math.max(spanX/kx, spanY)*111.32};
}

/* 擠不下的點就再放大一張：把沒標到名的點連同鄰近的點抓出來，
   縮小範圍重畫，直到全部標得出來或到達第 2 層。 */
function prZoomMaps(name, pts, depth){
  const r=prCityMap(name, pts, depth);
  let html=r.html;
  if(!html || depth>=2 || r.missed.length<2) return html;
  const linkKm=Math.max(r.span/5, 0.3);
  const groups=geoClusters(r.missed, linkKm);
  let n=0;
  groups.forEach(gr=>{
    if(gr.length<2) return;
    // 把落在這群範圍內的其他點也一起帶進子圖，才看得出彼此關係
    const lat0=Math.min(...gr.map(p=>p.lat)), lat1=Math.max(...gr.map(p=>p.lat));
    const lng0=Math.min(...gr.map(p=>p.lng)), lng1=Math.max(...gr.map(p=>p.lng));
    const sub=pts.filter(p=>p.lat>=lat0&&p.lat<=lat1&&p.lng>=lng0&&p.lng<=lng1);
    const use=sub.length>=gr.length? sub : gr;
    if(use.length>=pts.length) return;   // 沒縮小就別再畫，免得無限套下去
    n++;
    html+=prZoomMaps(name+'・放大'+(n>1?' '+n:''), use, depth+1);
  });
  return html;
}

function prMapSection(){
  const g=geoLoad();
  const all=mapTargets();
  const located=all.map(x=>{
    const v=g[x.q];
    return (v && v.lat!=null && !(v.lat===0&&v.lng===0)) ? Object.assign({},x,{lat:v.lat,lng:v.lng}) : null;
  }).filter(Boolean);
  const failed=all.length-located.length;
  if(located.length<2) return '';

  const med=a=>{ const s=[...a].sort((m,n)=>m-n), h=s.length>>1;
    return s.length%2? s[h] : (s[h-1]+s[h])/2; };
  const cityOf=list=>{
    const by={};
    list.forEach(p=>{ if(p.city) (by[p.city]=by[p.city]||[]).push(p); });
    return Object.keys(by).map(c=>{
      const a=by[c], days=[...new Set(a.map(x=>x.day))].sort((m,n)=>m-n);
      return { name:c, spots:a.length, days:days, lat:med(a.map(x=>x.lat)), lng:med(a.map(x=>x.lng)) };
    });
  };
  const seqOf=cityPts=>{
    const s=[];
    (trip().days||[]).forEach(d=>{
      const c=(d.city||'').trim();
      if(c && cityPts.some(x=>x.name===c) && s[s.length-1]!==c) s.push(c);
    });
    return s;
  };

  // 分群：出發地和目的地相隔一整個大陸時，硬塞進同一張圖會把目的地壓成一個小點，
  // 所以遠距的另外畫一張「全程總覽」，主要行程範圍再畫一張細部圖
  const groups=geoClusters(located, 600);
  const keep=Math.max(2, Math.round(located.length*0.12));
  const mainGroups=groups.filter(gr=>gr.length>=keep);
  const tiny=groups.filter(gr=>gr.length<keep);
  const main=mainGroups.length? mainGroups.reduce((a,gr)=>a.concat(gr),[]) : located;
  if(main.length<2) return '';

  const mainCities=cityOf(main), mainSeq=seqOf(mainCities);
  const detail=prMapCanvas(main, {mode:'detail', cityPts:mainCities, seq:mainSeq, id:1, legs:tripLegs(40)});

  // 遠距的小群（例如出發機場）：有的話就畫一張含它的總覽圖
  const far=[];
  const mLat=med(main.map(p=>p.lat)), mLng=med(main.map(p=>p.lng));
  tiny.forEach(gr=>{
    const p=gr[0];
    if(haversine(p.lat,p.lng,mLat,mLng)>1500) far.push(gr);
  });
  let overview='';
  if(far.length){
    const farPts=far.reduce((a,gr)=>a.concat(gr),[]);
    // 總覽圖上：遠地各自成一個節點，主要行程範圍縮成一個節點
    const ovCities=[];
    far.forEach(gr=>{
      ovCities.push({ name:(gr[0].city||gr[0].name), days:[Math.min(...gr.map(x=>x.day))],
        lat:med(gr.map(x=>x.lat)), lng:med(gr.map(x=>x.lng)) });
    });
    const firstMain=mainSeq[0]||mainCities[0].name;
    const fc=mainCities.find(c=>c.name===firstMain);
    if(fc) ovCities.push(fc);
    const ovSeq=ovCities.sort((a,b)=>a.days[0]-b.days[0]).map(c=>c.name);
    const ov=prMapCanvas(farPts.concat(main), {mode:'overview', cityPts:ovCities, seq:ovSeq, id:2, maxH:300});
    overview=`<div class="pr-mapwrap" style="margin-bottom:12px">${ov.svg}</div>
      <div class="pr-mapnote" style="margin:0 0 16px">＊ 全程總覽：從出發地到主要行程範圍的相對位置與交通方式。</div>`;
  }

  const rows=mainCities.slice().sort((a,b)=>a.days[0]-b.days[0]).map(c=>{
    const uniq=[...new Set(main.filter(p=>p.city===c.name).map(s=>s.name))];
    return `<div class="pr-cityrow"><b>${esc(c.name)}</b>　<span class="sp">Day ${
      c.days.length>1? c.days[0]+'–'+c.days[c.days.length-1] : c.days[0]}　${uniq.length} 個地點</span>`+
      `<div class="sp">${esc(uniq.join('・'))}</div></div>`;
  }).join('');

  const used=new Set(mainSeq.slice(1).map((c,i)=>legMode(mainSeq[i],c)));
  main.forEach(p=>{ if(p.mode==='cable'||p.mode==='boat'||p.mode==='flight') used.add(p.mode); });
  if(far.length) used.add('flight');
  const legend=[...used].map(m=>`<span>${MOVE_EMOJI[m]||'🚆'} ${MOVE_LABEL[m]||'交通'}</span>`).join('');

  // 每個城市的放大圖：只取離該城中心 50km 內的點，
  // 免得回程日掛在「巴黎」底下的瑞士車站又把比例尺拉爆
  const cityMaps=mainCities.slice().sort((a,b)=>a.days[0]-b.days[0]).map((c,i)=>{
    const near=main.filter(p=>p.city===c.name && haversine(p.lat,p.lng,c.lat,c.lng)<=50);
    return prZoomMaps(c.name, near, 0);
  }).filter(Boolean).join('');

  return `<section class="pr-chapter">
    <div class="pr-h2">🗺️ 全程地點總覽</div>
    ${overview}
    <div class="pr-mapwrap">${detail.svg}</div>
    <div class="pr-maplegend">
      <span>🟠 主要城市（數字＝造訪順序）</span><span>· 景點</span><span>┄ 移動路線</span>${legend}
    </div>
    <div class="pr-mapnote">＊ 依各地實際經緯度繪製，國界為簡化輪廓（示意用，非等比例街道地圖）。
      地圖上共 ${detail.total} 個地點、${mainCities.length} 個城市${detail.shown<detail.total?`；其中 ${detail.total-detail.shown} 個名稱因位置重疊未標出，詳見下方清單`:''}。
      ${failed?`<br>＊ 查不到座標未列入：${failed} 個地點。可在編輯模式把該站點的「Google 查詢字」改精確一點，下次匯出就會出現。`:''}</div>
    <div class="pr-citylist">${rows}</div>
    ${cityMaps?`<div class="pr-h2" style="margin-top:20px">🔍 各城市放大圖</div>
      <div class="pr-mapnote" style="margin:0 0 10px">＊ 同一城市內各景點的相對位置，右下角是比例尺。</div>
      <div class="pr-citymaps">${cityMaps}</div>`:''}
  </section>`;
}

function prStops(d){
  const s=d.stops||[];
  if(!s.length) return '<div class="pr-none">這天沒有安排站點。</div>';

  let lastP=null, out='';
  s.forEach((st,i)=>{

    if(p!==lastP){ out+=`<div class="pr-period">${PERIOD[p]}</div>`; lastP=p; }
    if(i>0){

      let mv=st.move;

  return out;
}

const CUR_LIST=['TWD','JPY','EUR','CHF','USD','KRW','THB','GBP','SGD','HKD','CNY','AUD','VND'];
let _ratesBusy=false;

// trip.rates 存「1 外幣 = 幾元台幣」
function rateOf(cur){
  if(!cur || cur==='TWD') return 1;
  const r=(trip().rates||{})[cur];
  return (typeof r==='number' && r>0) ? r : null;
}
function toTWD(amount, cur){
  const r=rateOf(cur);
  return r==null? null : amount*r;
}
// 免費匯率來源（不需註冊）：回傳 1 TWD = 幾外幣，取倒數就是我們要的
async function fetchRates(silent){
  if(_ratesBusy) return;
  _ratesBusy=true;
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/TWD');
    const j=await r.json();
    if(!j || !j.rates) throw 0;
    const t=trip();
    t.rates=t.rates||{};
    CUR_LIST.forEach(c=>{
      if(c==='TWD') return;
      const v=j.rates[c];
      if(typeof v==='number' && v>0) t.rates[c]=Math.round((1/v)*10000)/10000;
    });
    t.rates._at=(j.time_last_update_utc||'').slice(5,16) || new Date().toISOString().slice(0,10);
    save(); renderSplit();
    if(!silent) toast('匯率已更新 💱');
  }catch(e){
    if(!silent) toast('匯率抓取失敗，可手動填');
  }finally{ _ratesBusy=false; }
}
// 進分帳頁時，沒有匯率才自動抓一次（不要每次都打擾）
function autoRates(){
  const t=trip();

  if(!has) fetchRates(true);

/* 結算：算出每人淨額，再把「該收」與「該付」配對成最少的轉帳筆數 */
function settle(){
  const t=trip(), ms=t.members||[], net={}, unknown=[];
  ms.forEach(m=>net[m]=0);
  (t.expenses||[]).forEach(e=>{
    const twd=toTWD(Number(e.amount)||0, e.cur);
    if(twd==null){ unknown.push(e); return; }
    const sp=(e.split||[]).filter(m=>ms.indexOf(m)>=0);
    if(!sp.length) return;
    if(net[e.payer]==null) net[e.payer]=0;
    net[e.payer]+=twd;
    const share=twd/sp.length;
    sp.forEach(m=>{ net[m]-=share; });
  });
  const cred=[], debt=[];
  Object.keys(net).forEach(m=>{
    const v=Math.round(net[m]);
    if(v>0) cred.push([m,v]); else if(v<0) debt.push([m,-v]);
  });
  cred.sort((a,b)=>b[1]-a[1]); debt.sort((a,b)=>b[1]-a[1]);
  const tx=[];
  let i=0,j=0;
  while(i<debt.length && j<cred.length){
    const amt=Math.min(debt[i][1], cred[j][1]);
    if(amt>0) tx.push({from:debt[i][0], to:cred[j][0], amt:amt});
    debt[i][1]-=amt; cred[j][1]-=amt;
    if(debt[i][1]<=0) i++;
    if(cred[j][1]<=0) j++;
  }
  return {net:net, tx:tx, unknown:unknown};
}

      <div class="field"><label>誰代付</label><select id="ex_payer">${payerOpts}</select></div>
      <div class="field"><label>分給誰（勾選的人平均分攤）</label>
        <div class="cklist" id="ex_split">${splitBoxes}</div></div>
      <button class="btn" onclick="addExpense()">加入這筆</button>
    </div>

    <div class="card">
      <div class="checkhd"><h3>🧾 支出明細</h3>
        <span style="font-size:13px;color:var(--muted);font-weight:700">合計 ≈ TWD ${money(Math.round(totalTWD))}</span></div>
      ${rows}
    </div>

    <div class="card">
      <div class="checkhd"><h3>⚖️ 結算</h3></div>
      <div class="nets">${netRows}</div>
      ${st.unknown.length?`<div class="hint" style="color:#c0392b">有 ${st.unknown.length} 筆支出因為缺匯率沒有算進去，請先在上面填該幣別的匯率。</div>`:''}
      <div class="txhd">最少轉帳方式</div>
      <div class="txs">${txRows}</div>
      <div class="hint">系統會自動抵銷：如果 A 欠你、你又欠 B，會直接變成 A 付給 B，不用繞一圈。<br>金額只有幾十元的零頭，實務上直接忽略就好。</div>
    </div>`;
}

function addMember(){
  const el=document.getElementById('new_member'); const n=(el.value||'').trim();
  if(!n) return;
  const t=trip(); t.members=t.members||[];
  if(t.members.indexOf(n)>=0){ toast('已經有這個名字了'); return; }
  t.members.push(n); save(); renderSplit();
}
function delMember(i){
  const t=trip(), m=t.members[i];
  const used=(t.expenses||[]).some(e=>e.payer===m || (e.split||[]).indexOf(m)>=0);
  if(used && !confirm('「'+m+'」已經出現在支出紀錄裡，刪掉後那些紀錄會少一個分攤人。確定刪除？')) return;
  t.members.splice(i,1);
  (t.expenses||[]).forEach(e=>{ e.split=(e.split||[]).filter(x=>x!==m); });
  save(); renderSplit();
}
function setRate(cur,val){
  const t=trip(); t.rates=t.rates||{};
  const n=Number(val);
  if(val==='' ) delete t.rates[cur]; else if(n>0) t.rates[cur]=n;
  save(); renderSplit();
}
function addExpense(){
  const t=trip();
  const desc=val('ex_desc');
  const amt=Number(document.getElementById('ex_amt').value);
  const cur=document.getElementById('ex_cur').value;
  const payer=document.getElementById('ex_payer').value;
  const split=[...document.querySelectorAll('.sp_new')].filter(x=>x.checked).map(x=>x.value);
  if(!desc){ toast('請填品項'); return; }
  if(!(amt>0)){ toast('請填金額'); return; }
  if(!payer){ toast('請先新增成員'); return; }
  if(!split.length){ toast('至少要勾一個分攤的人'); return; }
  t.expenses=t.expenses||[];
  t.expenses.push({id:'e'+Date.now().toString(36), desc:desc, amount:amt, cur:cur, payer:payer, split:split});
  save(); renderSplit();
  toast('已記一筆：'+desc);
}
function delExpense(i){
  const t=trip();
  if(!confirm('刪除這筆支出？')) return;
  t.expenses.splice(i,1); save(); renderSplit();
}

/* ---------- misc ---------- */
function emptyState(em,t,s){ return `<div class="empty-state"><div class="em">${em}</div><div style="font-weight:800;font-size:17px;color:var(--ink)">${t}</div><div style="margin-top:6px">${s}</div></div>`; }
function setTab(tab){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['itin','food','cost','check','split'].forEach(x=>document.getElementById('view-'+x).style.display = x===tab?'':'none');
  if(tab==='food')renderFood(); if(tab==='cost')renderCost(); if(tab==='check')renderCheck();
  if(tab==='split'){ renderSplit(); autoRates(); }
}
function renderAll(){ renderHeader(); renderItin(); renderFood(); renderCost(); renderCheck(); renderSplit(); }

/* ---------- 啟動 ---------- */
initFirebase();          // 連上雲端
setEdit(false);          // 預設「檢視模式」（別人打開只能看）
load();                  // 先用本地／範例資料立刻顯示（離線也能看）
_booting = false;
renderAll();
startSync();             // 接上雲端即時同步：別人重整就看到你最新的
if(location.hash==='#edit') toggleEdit();   // 網址加 #edit 可直接跳出密碼框
</script>
